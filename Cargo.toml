"[package]\nname = \"bevy_dev_tools\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Collection of developer tools for the Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[features]\nbevy_ci_testing = [\"dep:serde\", \"dep:ron\"]\nscreenrecording = [\"dep:x264\"]\nwebgl = [\"bevy_render/webgl\"]\nwebgpu = [\"bevy_render/webgpu\"]\nschedule_data = [\n  \"dep:serde\",\n  \"dep:ron\",\n  \"dep:bevy_platform\",\n  \"dep:bevy_utils\",\n  \"dep:thiserror\",\n]\n\n[dependencies]\n# bevy\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\" }\nbevy_asset = { path = \"../bevy_asset\", version = \"0.19.0-dev\" }\nbevy_camera = { path = \"../bevy_camera\", version = \"0.19.0-dev\" }\nbevy_color = { path = \"../bevy_color\", version = \"0.19.0-dev\" }\nbevy_core_pipeline = { path = \"../bevy_core_pipeline\", version = \"0.19.0-dev\" }\nbevy_diagnostic = { path = \"../bevy_diagnostic\", version = \"0.19.0-dev\" }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\" }\nbevy_image = { path = \"../bevy_image\", version = \"0.19.0-dev\" }\nbevy_input = { path = \"../bevy_input\", version = \"0.19.0-dev\" }\nbevy_log = { path = \"../bevy_log\", version = \"0.19.0-dev\" }\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\" }\nbevy_pbr = { path = \"../bevy_pbr\", version = \"0.19.0-dev\" }\nbevy_picking = { path = \"../bevy_picking\", version = \"0.19.0-dev\" }\nbevy_render = { path = \"../bevy_render\", version = \"0.19.0-dev\" }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\" }\nbevy_time = { path = \"../bevy_time\", version = \"0.19.0-dev\" }\nbevy_text = { path = \"../bevy_text\", version = \"0.19.0-dev\" }\nbevy_transform = { path = \"../bevy_transform\", version = \"0.19.0-dev\" }\nbevy_shader = { path = \"../bevy_shader\", version = \"0.19.0-dev\" }\nbevy_ui = { path = \"../bevy_ui\", version = \"0.19.0-dev\" }\nbevy_ui_render = { path = \"../bevy_ui_render\", version = \"0.19.0-dev\" }\nbevy_utils = { path = \"../bevy_utils\", version = \"0.19.0-dev\", optional = true }\nbevy_window = { path = \"../bevy_window\", version = \"0.19.0-dev\" }\nbevy_state = { path = \"../bevy_state\", version = \"0.19.0-dev\" }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", optional = true }\nbevy_mesh = { path = \"../bevy_mesh\", version = \"0.19.0-dev\" }\nbevy_world_serialization = { path = \"../bevy_world_serialization\", version = \"0.19.0-dev\" }\n\n# other\nthiserror = { version = \"2.0\", default-features = false, optional = true }\nserde = { version = \"1.0\", features = [\"derive\"], optional = true }\nron = { version = \"0.12\", optional = true }\ntracing = { version = \"0.1\", default-features = false, features = [\"std\"] }\n\n[dev-dependencies]\n# Allow tests to depend on the names of systems.\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\", features = [\n  \"debug\",\n] }\n\n[target.'cfg(not(target_os = \"windows\"))'.dependencies]\nx264 = { version = \"0.5.0\", optional = true }\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
